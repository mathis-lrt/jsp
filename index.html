<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6f0">
  <title>Une petite question… ♡</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #542c36; background: #fff6f0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 28px; overflow-x: hidden; background: radial-gradient(ellipse at 15% 15%, #ffe4e7 0, transparent 48%), radial-gradient(ellipse at 90% 90%, #ffe8d7 0, transparent 48%), #fff6f0; }
    .note { position: absolute; top: 30px; left: 0; width: 100%; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .23em; text-transform: uppercase; color: #a1747d; }
    main { position: relative; text-align: center; width: min(100%, 780px); padding: 80px 0; }
    .heart { display: inline-grid; place-items: center; width: 94px; height: 94px; border-radius: 28px; background: #ffe1e6; color: #e95575; font-size: 58px; transform: rotate(-9deg); box-shadow: 0 10px 0 #f5d5d9; margin-bottom: 35px; }
    .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .2em; color: #ad7380; font-weight: 700; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(44px, 7.5vw, 82px); line-height: 1.08; letter-spacing: -.055em; margin: 20px 0; }
    h1 em { color: #e35b79; font-weight: 400; }
    [hidden] { display: none !important; }
    .step { max-width: 480px; margin: 32px auto 0; }
    .field-label, legend { display: block; margin-bottom: 16px; font-weight: 700; }
    input[type="date"], textarea { width: 100%; min-width: 0; padding: 18px; border: 1px solid #e8d4d5; border-radius: 18px; background: #fffaf7; color: #542c36; font: inherit; }
    textarea { resize: vertical; min-height: 100px; }
    input:focus-visible, textarea:focus-visible { outline: 3px solid #e75b7a; outline-offset: 3px; }
    .primary { background: #e75b7a; color: white; padding: 18px 30px; margin-top: 24px; font-size: 17px; }
    .primary:hover { background: #cf4564; }
    .back { display: block; margin: 22px auto 0; background: transparent; color: #99737b; padding: 10px; }
    fieldset { padding: 0; border: 0; margin: 0; }
    legend { width: 100%; }
    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .choice { position: relative; cursor: pointer; }
    .choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .choice span { display: grid; place-items: center; min-height: 78px; padding: 14px 8px; border: 1px solid #e8d4d5; border-radius: 18px; background: #fffaf7; line-height: 1.5; }
    .choice input:checked + span { border-color: #e75b7a; background: #ffe1e6; box-shadow: 0 0 0 1px #e75b7a; }
    .choice input:focus-visible + span { outline: 3px solid #542c36; outline-offset: 3px; }
    #custom-field { margin-top: 24px; text-align: left; }
    .summary { padding: 26px; background: #fffaf7; border: 1px solid #e8d4d5; border-radius: 24px; line-height: 1.8; }
    .summary p { margin: 8px 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .actions { display: flex; align-items: center; justify-content: center; gap: 20px; min-height: 84px; }
    button { font: inherit; font-weight: 700; border: 0; cursor: pointer; border-radius: 100px; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid #542c36; outline-offset: 5px; }
    #yes { min-width: 190px; padding: 23px 40px; color: white; background: #e75b7a; box-shadow: 0 7px 0 #c94160, 0 14px 30px #e75b7a26; font-size: 23px; transition: transform .2s, background .2s; }
    #yes:hover { background: #df4b6c; transform: translateY(-3px) rotate(-2deg); }
    #yes:active { transform: translateY(4px); box-shadow: 0 3px 0 #c94160; }
    .no-space { width: 98px; height: 52px; }
    #no { width: 98px; height: 52px; color: #9e7880; background: #fffaf7; border: 1px solid #e8d4d5; z-index: 5; }
    .hint { min-height: 22px; margin-top: 28px; color: #b38e94; font-size: 12px; }
    .confetti { position: fixed; top: -50px; pointer-events: none; color: #e75b7a; animation: fall var(--duration) linear forwards; z-index: 10; }
    @keyframes fall { to { transform: translate(var(--drift), 115vh) rotate(360deg); } }
    @media (max-width: 480px) { body { padding: 22px; } main { padding: 65px 0; } .heart { width: 78px; height: 78px; font-size: 48px; margin-bottom: 24px; } .actions { gap: 16px; } #yes { min-width: 160px; padding: 22px 30px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="note">Une petite question, juste pour toi</div>
  <main>
    <div class="heart" aria-hidden="true">♥</div>
    <p class="eyebrow">Toi + moi + un joli moment</p>
    <h1 id="question" tabindex="-1">tu veux venir en<br><em>date avec moi ?</em></h1>
    <div class="actions" id="actions">
      <button id="yes" type="button">Oui ! <span aria-hidden="true">♡</span></button>
      <div class="no-space"><button id="no" type="button">Non</button></div>
    </div>
    <p class="hint" id="hint" role="status" aria-live="polite">Psst… le « non » est un peu timide.</p>
    <form id="date-step" class="step" hidden>
      <label class="field-label" for="date">Choisis la date qui te fait envie ♡</label>
      <input id="date" name="date" type="date" required>
      <button class="primary" type="submit">Choisir notre activité →</button>
    </form>
    <form id="activity-step" class="step" hidden>
      <fieldset>
        <legend>Qu’est-ce qui te ferait plaisir ?</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="activity" value="Resto" required><span>🍝 Resto</span></label>
          <label class="choice"><input type="radio" name="activity" value="Netflix & chill"><span>🍿 Netflix & chill</span></label>
          <label class="choice"><input type="radio" name="activity" value="Activité"><span>🎨 Activité</span></label>
          <label class="choice"><input type="radio" name="activity" value="Cinéma"><span>🎬 Cinéma</span></label>
          <label class="choice"><input type="radio" name="activity" value="Spa"><span>🫧 Spa</span></label>
          <label class="choice"><input type="radio" name="activity" value="custom"><span>💌 J’ai une autre idée</span></label>
        </div>
      </fieldset>
      <div id="custom-field" hidden>
        <label class="field-label" for="custom-activity">Propose ce que tu veux</label>
        <textarea id="custom-activity" name="custom-activity" maxlength="500" placeholder="Une balade, un pique-nique…" disabled></textarea>
      </div>
      <button class="primary" type="submit">C’est parti ♡</button>
      <button class="back" id="back-date" type="button">← Changer la date</button>
    </form>
    <section id="summary-step" class="step" aria-label="Notre rendez-vous" hidden>
      <div class="summary">
        <p id="summary-date"></p>
        <p id="summary-activity"></p>
      </div>
      <button class="back" id="back-activity" type="button">← Modifier notre rendez-vous</button>
    </section>
  </main>
  <script>
    const no = document.getElementById('no');
    const yes = document.getElementById('yes');
    const hint = document.getElementById('hint');
    let accepted = false;

    function escapeButton(pointerX, pointerY) {
      if (accepted) return;
      const margin = 16;
      const width = no.offsetWidth;
      const height = no.offsetHeight;
      const maxX = Math.max(margin, window.innerWidth - width - margin);
      const maxY = Math.max(margin, window.innerHeight - height - margin);
      const yesRect = yes.getBoundingClientRect();
      let best = { x: margin, y: margin, score: -Infinity };
      for (let i = 0; i < 60; i++) {
        const x = margin + Math.random() * (maxX - margin);
        const y = margin + Math.random() * (maxY - margin);
        const overlapsYes = x < yesRect.right + 20 && x + width > yesRect.left - 20 && y < yesRect.bottom + 20 && y + height > yesRect.top - 20;
        if (overlapsYes) continue;
        const score = Math.hypot(x + width / 2 - pointerX, y + height / 2 - pointerY);
        if (score > best.score) best = { x, y, score };
        if (score > 220) break;
      }
      no.style.position = 'fixed';
      no.style.left = best.x + 'px';
      no.style.top = best.y + 'px';
      hint.textContent = 'Oups… il a encore filé !';
    }

    document.addEventListener('pointermove', (event) => {
      if (accepted || event.pointerType === 'touch') return;
      const rect = no.getBoundingClientRect();
      const dx = Math.max(rect.left - event.clientX, 0, event.clientX - rect.right);
      const dy = Math.max(rect.top - event.clientY, 0, event.clientY - rect.bottom);
      if (Math.hypot(dx, dy) < 65) escapeButton(event.clientX, event.clientY);
    });
    no.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      escapeButton(event.clientX, event.clientY);
    });
    no.addEventListener('click', () => {
      const rect = no.getBoundingClientRect();
      escapeButton(rect.left + rect.width / 2, rect.top + rect.height / 2);
    });
    window.addEventListener('resize', () => {
      no.style.position = '';
      no.style.left = '';
      no.style.top = '';
    });

    const dateInput = document.getElementById('date');
    const activityForm = document.getElementById('activity-step');
    const customInput = document.getElementById('custom-activity');
    const today = new Date();
    dateInput.min = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

    function showStep(step, title) {
      for (const id of ['date-step', 'activity-step', 'summary-step']) {
        document.getElementById(id).hidden = id !== step;
      }
      const heading = document.getElementById('question');
      heading.innerHTML = title;
      heading.focus();
    }

    yes.addEventListener('click', () => {
      accepted = true;
      document.getElementById('actions').hidden = true;
      hint.hidden = true;
      showStep('date-step', 'On se voit <em>quand ?</em>');
    });

    document.getElementById('date-step').addEventListener('submit', (event) => {
      event.preventDefault();
      showStep('activity-step', 'On fait <em>quoi ?</em>');
    });

    activityForm.addEventListener('change', () => {
      const isCustom = activityForm.elements.activity.value === 'custom';
      document.getElementById('custom-field').hidden = !isCustom;
      customInput.disabled = !isCustom;
      customInput.required = isCustom;
      customInput.setCustomValidity('');
      if (isCustom) customInput.focus();
    });
    customInput.addEventListener('input', () => customInput.setCustomValidity(''));
    document.getElementById('back-date').addEventListener('click', () => {
      showStep('date-step', 'On se voit <em>quand ?</em>');
    });
    document.getElementById('back-activity').addEventListener('click', () => {
      showStep('activity-step', 'On fait <em>quoi ?</em>');
    });

    activityForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const selected = activityForm.elements.activity.value;
      const activity = selected === 'custom' ? customInput.value.trim() : selected;
      if (!activity) {
        customInput.setCustomValidity('Écris ton idée pour notre rendez-vous.');
        customInput.reportValidity();
        return;
      }
      const [year, month, day] = dateInput.value.split('-').map(Number);
      const formattedDate = new Date(year, month - 1, day).toLocaleDateString('fr-FR', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
      document.getElementById('summary-date').textContent = '🗓️ ' + formattedDate;
      document.getElementById('summary-activity').textContent = '♡ ' + activity;
      showStep('summary-step', 'C’est un <em>date !</em>');
      celebrate();
    });

    function celebrate() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      for (let i = 0; i < 36; i++) {
        const heart = document.createElement('span');
        heart.className = 'confetti';
        heart.textContent = i % 2 ? '♥' : '♡';
        heart.setAttribute('aria-hidden', 'true');
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = 15 + Math.random() * 24 + 'px';
        heart.style.setProperty('--duration', 3 + Math.random() * 3 + 's');
        heart.style.setProperty('--drift', Math.random() * 100 - 50 + 'px');
        heart.style.animationDelay = Math.random() * 1.5 + 's';
        document.body.appendChild(heart);
        heart.addEventListener('animationend', () => heart.remove(), { once: true });
      }
    }
  </script>
</body>
</html>
